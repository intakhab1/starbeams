<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARBEAMS, radio astronomy at IIT Kanpur</title>
<meta name="description" content="STARBEAMS is a radio astronomy research group in the Department of Space, Planetary & Astronomical Sciences & Engineering at IIT Kanpur, led by Prof. Mohit Bhardwaj.">
<style>
  html, body { height: 100%; margin: 0; background: #fff; }
  #site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!--
  This page stays on the IIT Kanpur server and never needs changing.
  It shows the STARBEAMS website from GitHub Pages (github.com/intakhab1/starbeams),
  so every edit made on GitHub appears here on its own, within about ten minutes.
  The site's address is written once, in the src of the frame below.
-->
<iframe id="site" title="STARBEAMS website" src="https://intakhab1.github.io/starbeams/" allowfullscreen></iframe>
<script>
  const frame = document.getElementById('site');
  const SITE = frame.getAttribute('src');
  const origin = new URL(SITE).origin;
  if (location.hash) frame.src = SITE + location.hash; /* a link such as …/#publications opens that page */

  const icon = document.createElement('link'); /* the site's own tab icon */
  icon.rel = 'icon'; icon.type = 'image/png'; icon.href = SITE + 'media/img/logo/favicon-64.png';
  document.head.append(icon);

  /* space, the arrow keys and Page Down scroll the site at once, without a click into it first */
  frame.addEventListener('load', () => frame.focus());

  /* the site reports each page it shows; the tab title and the address follow, so a page can be shared */
  window.addEventListener('message', (e) => {
    if (e.origin !== origin || !e.data || e.data.type !== 'starbeams:page') return;
    const { title, hash } = e.data;
    if (typeof title === 'string') document.title = title;
    if (typeof hash === 'string' && /^(#[\w-]*)?$/.test(hash) && hash !== location.hash) {
      history.replaceState(null, '', location.pathname + location.search + hash);
    }
  });

  /* a hash typed into the address bar opens that page in the site */
  window.addEventListener('hashchange', () => { frame.src = SITE + location.hash; });
</script>
</body>
</html>
